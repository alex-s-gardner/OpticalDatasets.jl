name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch, never on main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite itself is seconds. The budget is for installing GDAL's binaries, which is the
    # slowest and least predictable part of this job.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Named channels where they can be, so there is nothing to bump when a new Julia lands. The
        # oldest is 1.11 rather than the LTS: ChunkManifests and its Zarr.jl branch resolve only through
        # `[sources]`, which Pkg ignores before 1.11.
        version: ['1.11', '1', 'pre']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        exclude:
          # One OS is enough to catch a breaking change on an unreleased Julia; three would
          # triple the cost of the job most likely to be red for reasons outside this package.
          - version: 'pre'
            os: macOS-latest
          - version: 'pre'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
